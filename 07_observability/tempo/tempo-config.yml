# ==========================================
# Tempo Configuration
# AI Performance Engineering Observability
# ==========================================
# Distributed tracing backend for OpenTelemetry

server:
  http_listen_port: 3200

# Distributor receives traces
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    zipkin:
      endpoint: 0.0.0.0:9411

# Ingester writes traces to storage
ingester:
  max_block_duration: 5m

# Compactor optimizes storage
compactor:
  compaction:
    block_retention: 168h  # 7 days

# Metrics generator creates metrics from traces
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: ai-pe
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    service_graphs:
      dimensions:
        - service
        - http.method
        - http.status_code
    span_metrics:
      dimensions:
        - service.name
        - http.method
        - http.status_code
        - llm.model
        - llm.request_type

# Storage backend (local filesystem for single-node)
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Query configuration
querier:
  frontend_worker:
    frontend_address: tempo:9095

# Overrides (limits)
overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics

# Analytics
usage_report:
  reporting_enabled: false
