# ==========================================
# Grafana Dashboard Provisioning
# AI Performance Engineering Observability
# ==========================================

apiVersion: 1

providers:
  - name: 'AI Performance Engineering'
    orgId: 1
    folder: 'AI Performance Engineering'
    folderUid: 'ai-pe'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
