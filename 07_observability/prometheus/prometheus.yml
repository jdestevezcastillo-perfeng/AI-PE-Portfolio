# ==========================================
# Prometheus Configuration
# AI Performance Engineering Observability
# ==========================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    monitor: 'ai-pe-monitor'

# Alerting configuration (optional - add alertmanager later)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Rule files (optional - add alert rules later)
# rule_files:
#   - /etc/prometheus/rules/*.yml

scrape_configs:
  # ==========================================
  # Prometheus self-monitoring
  # ==========================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'prometheus'

  # ==========================================
  # System Metrics (Node Exporter)
  # ==========================================
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'localhost'

  # ==========================================
  # GPU Metrics (NVIDIA DCGM Exporter)
  # ==========================================
  - job_name: 'nvidia-gpu'
    static_configs:
      - targets: ['dcgm-exporter:9400']
        labels:
          instance: 'localhost'
          gpu_type: 'nvidia'
    scrape_interval: 2s  # More frequent for GPU monitoring

  # ==========================================
  # LLM Inference Metrics (Ollama Exporter)
  # ==========================================
  - job_name: 'ollama'
    static_configs:
      - targets: ['ollama-exporter:9103']
        labels:
          instance: 'localhost'
    scrape_interval: 5s


  # ==========================================
  # vLLM Inference Metrics
  # ==========================================
  - job_name: 'vllm'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          instance: 'vllm-server'
    scrape_interval: 2s

  # ==========================================
  # TGI Inference Metrics
  # ==========================================
  - job_name: 'tgi'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          instance: 'tgi-server'
    scrape_interval: 2s

  # ==========================================
  # Tempo (Traces) Metrics
  # ==========================================
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
        labels:
          instance: 'tempo'

  # ==========================================
  # Loki (Logs) Metrics
  # ==========================================
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          instance: 'loki'
